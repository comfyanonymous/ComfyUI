services:
  comfyui:
    image: comfyui-sos-comfyui:h3-local
    build:
      context: ./temp/h3-build/wheels
      dockerfile: ../../../Dockerfile.h3-local
    # 仅显式打开管理器入口；保留现有显存预留和分配器设置。
    command:
      - /bin/sh
      - -lc
      - umask 0002 && exec python main.py --listen 0.0.0.0 --port 8188 --enable-manager --enable-manager-legacy-ui --disable-cuda-malloc --reserve-vram 1.5
