name: comfyui-sos

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.10-slim-bookworm}
        APT_MIRROR: ${APT_MIRROR:-}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-}
        # 默认 CPU 版本；如需 GPU，请使用 docker-compose.gpu.yml
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    image: comfyui-sos:cpu
    container_name: comfyui-sos
    ports:
      - "8188:8188"
    volumes:
      # 持久化数据目录：模型、输出、输入、用户配置、自定义节点
      - ./models:/app/models
      - ./output:/app/output
      - ./input:/app/input
      - ./user:/app/user
      - ./temp:/app/temp
      - ./custom_nodes:/app/custom_nodes
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    # CPU 版本无需 GPU 资源，保持默认即可
    # 如需 GPU，请改用 docker-compose.gpu.yml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/', timeout=5).read(1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
