[project]
name = "ComfyUI"
version = "0.13.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.11.*"

dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "xformers==0.0.29.post1",
    "transformers>=4.43.2",
    "comfyui-frontend-package==1.38.14",
    "comfyui-workflow-templates==0.8.38",
    "comfyui-embedded-docs==0.4.1",
    "torchsde>=0.2.6",
    "numpy>=1.25.0",
    "einops>=0.8.2",
    "tokenizers>=0.13.3",
    "sentencepiece>=0.2.1",
    "safetensors>=0.4.2",
    "aiohttp>=3.11.8",
    "yarl>=1.18.0",
    "pyyaml>=6.0.3",
    "pillow>=10.3.0",
    "scipy>=1.17.0",
    "tqdm>=4.66.5",
    "psutil>=7.2.2",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.46",
    "av>=14.2.0",
    "comfy-kitchen>=0.2.7",
    "comfy-aimdo>=0.1.8",
    "requests>=2.28.1",
    "kornia>=0.7.1",
    "spandrel>=0.4.1",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "opencv-python>=4.13.0.92",
    "matplotlib>=3.10.8",
    "setuptools>=70.2.0",
    "comfyui-manager==4.1b1",
    "color-matcher>=0.5.0",
    "huggingface-hub>=0.23.4",
    "mss>=10.1.0",
    "opencv-python-headless>=4.13.0.92",
    "diffusers>=0.36.0",
    "accelerate>=1.12.0",
    "clip-interrogator>=0.6.0",
    "lark>=1.3.1",
    "onnxruntime>=1.24.1",
    "peft>=0.18.1",
    "numba>=0.63.1",
    "colour-science>=0.4.7",
    "rembg>=2.0.69",
    "pixeloe>=0.1.4",
    "transparent-background>=1.3.4",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "opencv-contrib-python>=4.13.0.92",
    "pymatting>=1.1.15",
    "timm>=1.0.24",
    "blend-modes>=2.2.0",
    "loguru>=0.7.3",
]

[project.urls]
homepage = "https://www.comfy.org/"
repository = "https://github.com/comfyanonymous/ComfyUI"
documentation = "https://docs.comfy.org/"

[tool.ruff]
lint.select = [
  "N805", # invalid-first-argument-name-for-method
  "S307", # suspicious-eval-usage
  "S102", # exec
  "E",
  "T",    # print-usage
  "W",
  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
  # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
]

lint.ignore = ["E501", "E722", "E731", "E712", "E402", "E741"]

exclude = ["*.ipynb", "**/generated/*.pyi"]

[tool.pylint]
master.py-version = "3.10"
master.extension-pkg-allow-list = [
  "pydantic",
]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "line-too-long",
  "too-few-public-methods",
  "too-many-public-methods",
  "too-many-instance-attributes",
  "too-many-positional-arguments",
  "broad-exception-raised",
  "too-many-lines",
  "invalid-name",
  "unused-argument",
  "broad-exception-caught",
  "consider-using-with",
  "fixme",
  "too-many-statements",
  "too-many-branches",
  "too-many-locals",
  "too-many-arguments",
  "too-many-return-statements",
  "too-many-nested-blocks",
  "duplicate-code",
  "abstract-method",
  "superfluous-parens",
  "arguments-differ",
  "redefined-builtin",
  "unnecessary-lambda",
  "dangerous-default-value",
  "invalid-overridden-method",
  # next warnings should be fixed in future
  "bad-classmethod-argument",  # Class method should have 'cls' as first argument
  "wrong-import-order",  # Standard imports should be placed before third party imports
  "ungrouped-imports",
  "unnecessary-pass",
  "unnecessary-lambda-assignment",
  "no-else-return",
  "unused-variable",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
xformers = { index = "pytorch-cu121" }

